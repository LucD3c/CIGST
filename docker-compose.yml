services:
  db:
    # Version fijada (no "latest" ni tags flotantes): actualizarla es una
    # decision consciente, no un efecto colateral de un rebuild.
    image: postgres:16.14-alpine
    restart: unless-stopped
    # Bloquea escalada de privilegios via binarios setuid/setgid dentro del
    # contenedor. No afecta el funcionamiento normal de Postgres.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cigst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Sin "ports": la base solo es alcanzable desde otros contenedores de esta
    # red interna de compose, nunca desde fuera del host.
    networks:
      - cigst_net

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    security_opt:
      - no-new-privileges:true
    environment:
      # connection_limit: tamanio del pool de conexiones a Postgres. Sin este
      # parametro Prisma usa cpus*2+1 (5 en una VM de 2 nucleos), que con
      # decenas de personas trabajando a la vez se agota y deja pedidos
      # esperando. pool_timeout da margen para esperar un lugar libre en
      # vez de fallar en el acto.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connection_limit=${DB_POOL:-30}&pool_timeout=20
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    # Si una migracion falla, la plataforma NO arranca (es lo correcto: mejor
    # no levantar que levantar con la base a medias). Lo que si cambia es el
    # mensaje: antes se veia un error crudo de Prisma y nadie sabia que hacer.
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed || {
        echo '';
        echo '===============================================================';
        echo ' CIGST no pudo actualizar la base de datos.';
        echo '';
        echo ' La plataforma NO va a arrancar, y eso es a proposito: es mas';
        echo ' seguro no levantar que levantar con la base a medias.';
        echo '';
        echo ' TUS DATOS ESTAN INTACTOS. No se borro ni se modifico nada.';
        echo '';
        echo ' Que hacer:';
        echo '  1. Mira el detalle del error mas arriba de este mensaje.';
        echo '  2. Verifica que el disco no este lleno (df -h).';
        echo '  3. Si venis de una version vieja, hace una copia de seguridad';
        echo '     (opcion 6 del instalador) antes de volver a intentar.';
        echo '  4. Volve a ejecutar la opcion 1 del instalador.';
        echo '===============================================================';
        echo '';
        exit 1;
      }"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cigst_net
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Sistema de archivos de solo lectura: el proceso Node no necesita
    # escribir nada propio en runtime (sirve estaticos ya compilados, loguea
    # a stdout, no guarda uploads). Si una dependencia comprometida intentara
    # escribir un archivo (ej. un webshell), el filesystem lo rechaza. /tmp
    # queda aparte en tmpfs (memoria) por si algo interno lo necesita.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Adjuntos de tickets y chat. Es un volumen aparte para que sobreviva a
      # los rebuild y para que sea escribible aunque el resto del contenedor
      # sea de solo lectura.
      - cigst_uploads:/app/uploads
    environment:
      NODE_ENV: production
      # Clave para cifrar las contrasenas de las casillas de correo. Si esta
      # vacia, la seccion Correo queda desactivada y el resto sigue igual.
      MAIL_ENCRYPTION_KEY: ${MAIL_ENCRYPTION_KEY:-}
      PORT: 3000
      # Zona horaria para los historiales de cambios y timestamps legibles.
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      # connection_limit: tamanio del pool de conexiones a Postgres. Sin este
      # parametro Prisma usa cpus*2+1 (5 en una VM de 2 nucleos), que con
      # decenas de personas trabajando a la vez se agota y deja pedidos
      # esperando. pool_timeout da margen para esperar un lugar libre en
      # vez de fallar en el acto.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?connection_limit=${DB_POOL:-30}&pool_timeout=20
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      TRUST_PROXY: ${TRUST_PROXY}
      LOG_LEVEL: ${LOG_LEVEL}
      # Retencion de datos sin uso y control de disco (ver .env.example).
      RETENTION_NOTIF_LEIDAS_DIAS: ${RETENTION_NOTIF_LEIDAS_DIAS:-90}
      RETENTION_NOTIF_SIN_LEER_DIAS: ${RETENTION_NOTIF_SIN_LEER_DIAS:-365}
      UPLOADS_MAX_GB: ${UPLOADS_MAX_GB:-20}
      UPLOADS_AVISO_PORCENTAJE: ${UPLOADS_AVISO_PORCENTAJE:-80}
      DISCO_MINIMO_LIBRE_MB: ${DISCO_MINIMO_LIBRE_MB:-1024}
      IMAGEN_MAX_LADO: ${IMAGEN_MAX_LADO:-1600}
      IMAGEN_CALIDAD: ${IMAGEN_CALIDAD:-0.82}
    ports:
      # APP_BIND define en que direccion escucha. Por defecto 0.0.0.0 (toda
      # la red local, que es el uso normal). Si la plataforma va detras de
      # nginx conviene 127.0.0.1 para que nadie pueda saltearse el proxy;
      # si el servidor tiene varias placas de red, se pone la IP de la
      # placa que corresponda.
      - '${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - cigst_net

networks:
  cigst_net:
    driver: bridge

volumes:
  cigst_pgdata:
  cigst_uploads:
