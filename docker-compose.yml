services:
  db:
    # Version fijada (no "latest" ni tags flotantes): actualizarla es una
    # decision consciente, no un efecto colateral de un rebuild.
    image: postgres:16.14-alpine
    restart: unless-stopped
    # Bloquea escalada de privilegios via binarios setuid/setgid dentro del
    # contenedor. No afecta el funcionamiento normal de Postgres.
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - cigst_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Sin "ports": la base solo es alcanzable desde otros contenedores de esta
    # red interna de compose, nunca desde fuera del host.
    networks:
      - cigst_net

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: builder
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cigst_net
    restart: 'no'

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Sistema de archivos de solo lectura: el proceso Node no necesita
    # escribir nada propio en runtime (sirve estaticos ya compilados, loguea
    # a stdout, no guarda uploads). Si una dependencia comprometida intentara
    # escribir un archivo (ej. un webshell), el filesystem lo rechaza. /tmp
    # queda aparte en tmpfs (memoria) por si algo interno lo necesita.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      PORT: 3000
      # Zona horaria para los historiales de cambios y timestamps legibles.
      TZ: ${TZ:-America/Argentina/Buenos_Aires}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS}
      COOKIE_SECURE: ${COOKIE_SECURE}
      TRUST_PROXY: ${TRUST_PROXY}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - cigst_net

networks:
  cigst_net:
    driver: bridge

volumes:
  cigst_pgdata:
